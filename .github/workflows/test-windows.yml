name: Test Windows installer
on:
  workflow_dispatch:

jobs:
  windows:
    name: Fresh Windows - real Setup.exe install, then update
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Download Setup.exe exactly as a customer would
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest "https://github.com/SINOBI-Melloflex/billkora/releases/latest/download/Billcora-Setup.exe" -OutFile "$env:RUNNER_TEMP\Setup.exe"
          $m = (Get-Item "$env:RUNNER_TEMP\Setup.exe").Length / 1MB
          Write-Host "Setup.exe MB: $m"
          if ($m -lt 30) { throw "Setup.exe too small" }

      - name: Fresh install with /silent (like a brand new PC)
        shell: pwsh
        run: |
          $p = Start-Process "$env:RUNNER_TEMP\Setup.exe" -ArgumentList "/silent" -PassThru
          if (-not $p.WaitForExit(900000)) { try { $p.Kill() } catch {}; throw "Setup did not finish in 15 minutes" }
          Write-Host "Setup exit code: $($p.ExitCode)"
          Get-Content "$env:TEMP\Billcora-Setup.log" -ErrorAction SilentlyContinue | Select-Object -Last 40
          if ($p.ExitCode -ne 0) { throw "Setup failed" }

      - name: App is installed in its folder and works
        shell: pwsh
        run: |
          if (-not (Test-Path C:\Billcora\server.js)) { throw "server.js missing" }
          $port = (Get-Content C:\Billcora\port.txt).Trim()
          Write-Host "port $port"
          schtasks /Query /TN Billcora /V /FO LIST | Select-String "Run As User|Status"
          $null = Invoke-WebRequest "http://127.0.0.1:$port/login" -Method Post -Body @{ username = "admin"; password = "admin123" } -SessionVariable s -UseBasicParsing
          foreach ($pg in "/", "/zones", "/packages", "/payments", "/settings", "/users") {
            $r = Invoke-WebRequest "http://127.0.0.1:$port$pg" -WebSession $s -UseBasicParsing
            Write-Host "$pg -> $($r.StatusCode)"
            if ($r.StatusCode -ne 200 -or $r.Content -match "<title>Sign in") { throw "$pg failed" }
            if ($pg -eq "/" -and $r.Content -notmatch 'id="bc-upd"') { throw "update button missing" }
          }
          Write-Host "version.txt: $((Get-Content C:\Billcora\version.txt).Trim())"

      - name: Put marker data in database and config
        shell: pwsh
        run: |
          $js = "const D=require('C:/Billcora/node_modules/better-sqlite3');const d=new D('C:/Billcora/billing.db');d.exec('create table if not exists zz_marker(x)');d.exec('insert into zz_marker values(42)');console.log('marker written');"
          Set-Content -Path "$env:RUNNER_TEMP\mark.js" -Value $js
          & C:\Billcora\runtime\node.exe "$env:RUNNER_TEMP\mark.js"
          if ($LASTEXITCODE -ne 0) { throw "marker write failed" }
          Add-Content C:\Billcora\config.js "// kept-marker"

      - name: Run the same Setup again (update of an existing install)
        shell: pwsh
        run: |
          $p = Start-Process "$env:RUNNER_TEMP\Setup.exe" -ArgumentList "/silent" -PassThru
          if (-not $p.WaitForExit(900000)) { try { $p.Kill() } catch {}; throw "Update did not finish in 15 minutes" }
          Write-Host "Update exit code: $($p.ExitCode)"
          Get-Content "$env:TEMP\Billcora-Setup.log" -ErrorAction SilentlyContinue | Select-Object -Last 40
          if ($p.ExitCode -ne 0) { throw "Update failed" }

      - name: Data and settings survived the update, backup exists
        shell: pwsh
        run: |
          $js = "const D=require('C:/Billcora/node_modules/better-sqlite3');const d=new D('C:/Billcora/billing.db',{readonly:true});console.log('MARKER=' + d.prepare('select x from zz_marker').get().x);"
          Set-Content -Path "$env:RUNNER_TEMP\check.js" -Value $js
          $out = (& C:\Billcora\runtime\node.exe "$env:RUNNER_TEMP\check.js") -join ''
          Write-Host $out
          if ($out -notmatch 'MARKER=42') { throw "database marker lost" }
          if (-not (Select-String -Path C:\Billcora\config.js -Pattern "kept-marker" -Quiet)) { throw "config.js was overwritten" }
          $b = @(Get-ChildItem C:\Billcora\backups -Directory -Filter "update-before-*")
          Write-Host "backups: $($b.Count)"
          if ($b.Count -lt 1) { throw "no backup folder" }
          $port = (Get-Content C:\Billcora\port.txt).Trim()
          $r = Invoke-WebRequest "http://127.0.0.1:$port/login" -UseBasicParsing
          if ($r.StatusCode -ne 200) { throw "app not up after update" }
          Write-Host "update OK"