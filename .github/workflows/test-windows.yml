name: Test Windows installer
on:
  workflow_dispatch:

jobs:
  update:
    name: Windows - install 0.2.3 then update to latest
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Download old (v0.2.3) and latest installers
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest "https://github.com/SINOBI-Melloflex/billkora/releases/download/v0.2.3/Billcora-Setup-0.2.3.exe" -OutFile "$env:RUNNER_TEMP\Old.exe"
          Invoke-WebRequest "https://github.com/SINOBI-Melloflex/billkora/releases/latest/download/Billcora-Setup.exe" -OutFile "$env:RUNNER_TEMP\New.exe"
          Get-ChildItem "$env:RUNNER_TEMP\*.exe" | Select-Object Name, Length

      - name: Fresh install of 0.2.3 (silent)
        shell: pwsh
        run: |
          $p = Start-Process "$env:RUNNER_TEMP\Old.exe" -ArgumentList "/silent" -PassThru
          if (-not $p.WaitForExit(900000)) { try { $p.Kill() } catch {}; throw "Old setup did not finish" }
          Write-Host "exit code: $($p.ExitCode)"
          Get-Content "$env:TEMP\Billcora-Setup.log" -ErrorAction SilentlyContinue | Select-Object -Last 30
          if ($p.ExitCode -ne 0) { throw "old install failed" }
          Write-Host "version: $((Get-Content C:\Billcora\version.txt).Trim())"

      - name: Put marker data in database and config
        shell: pwsh
        run: |
          $js = "const D=require('C:/Billcora/node_modules/better-sqlite3');const d=new D('C:/Billcora/billing.db');d.exec('create table if not exists zz_marker(x)');d.exec('insert into zz_marker values(42)');console.log('marker written');"
          Set-Content -Path "$env:RUNNER_TEMP\mark.js" -Value $js
          & C:\Billcora\runtime\node.exe "$env:RUNNER_TEMP\mark.js"
          if ($LASTEXITCODE -ne 0) { throw "marker write failed" }
          Add-Content C:\Billcora\config.js "// kept-marker"

      - name: Update to latest with the new Setup
        shell: pwsh
        run: |
          $p = Start-Process "$env:RUNNER_TEMP\New.exe" -ArgumentList "/silent" -PassThru
          if (-not $p.WaitForExit(900000)) { try { $p.Kill() } catch {}; throw "Update did not finish" }
          Write-Host "update exit code: $($p.ExitCode)"
          Get-Content "$env:TEMP\Billcora-Setup.log" -ErrorAction SilentlyContinue | Select-Object -Last 40
          if ($p.ExitCode -ne 0) { throw "Update failed" }

      - name: Data, settings, version and backup are correct after update
        shell: pwsh
        run: |
          $js = "const D=require('C:/Billcora/node_modules/better-sqlite3');const d=new D('C:/Billcora/billing.db',{readonly:true});console.log('MARKER=' + d.prepare('select x from zz_marker').get().x);"
          Set-Content -Path "$env:RUNNER_TEMP\check.js" -Value $js
          $o = (& C:\Billcora\runtime\node.exe "$env:RUNNER_TEMP\check.js") -join ''
          Write-Host $o
          if ($o -notmatch 'MARKER=42') { throw "database marker lost" }
          if (-not (Select-String -Path C:\Billcora\config.js -Pattern "kept-marker" -Quiet)) { throw "config.js was overwritten" }
          $b = @(Get-ChildItem C:\Billcora\backups -Directory -Filter "update-before-*")
          Write-Host "backups: $($b.Count)"
          if ($b.Count -lt 1) { throw "no backup folder" }
          $v = (Get-Content C:\Billcora\version.txt).Trim()
          Write-Host "version: $v"
          if ($v -ne '0.2.4') { throw "version not updated" }
          $port = (Get-Content C:\Billcora\port.txt).Trim()
          $null = Invoke-WebRequest "http://127.0.0.1:$port/login" -Method Post -Body @{ username = "admin"; password = "admin123" } -SessionVariable s -UseBasicParsing
          foreach ($pg in "/", "/zones", "/packages", "/payments", "/settings", "/users") {
            $r = Invoke-WebRequest "http://127.0.0.1:$port$pg" -WebSession $s -UseBasicParsing
            Write-Host "$pg -> $($r.StatusCode)"
            if ($r.StatusCode -ne 200 -or $r.Content -match "<title>Sign in") { throw "$pg failed" }
          }
          Write-Host "UPDATE OK"

      - name: Debug report
        if: failure()
        shell: pwsh
        run: |
          Get-Content "$env:TEMP\Billcora-Setup.log" -ErrorAction SilentlyContinue
          Get-ChildItem "$env:USERPROFILE\Desktop","C:\Billcora" -Filter "Billcora-Setup-Report*.txt" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName; Get-Content $_.FullName }
          Get-ChildItem C:\Billcora\backups -ErrorAction SilentlyContinue | Select-Object Name

  fresh:
    name: Windows - brand new PC, latest installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Download latest installer
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest "https://github.com/SINOBI-Melloflex/billkora/releases/latest/download/Billcora-Setup.exe" -OutFile "$env:RUNNER_TEMP\New.exe"

      - name: Fresh install (silent)
        shell: pwsh
        run: |
          $p = Start-Process "$env:RUNNER_TEMP\New.exe" -ArgumentList "/silent" -PassThru
          if (-not $p.WaitForExit(900000)) { try { $p.Kill() } catch {}; throw "Setup did not finish" }
          Write-Host "exit code: $($p.ExitCode)"
          Get-Content "$env:TEMP\Billcora-Setup.log" -ErrorAction SilentlyContinue | Select-Object -Last 30
          if ($p.ExitCode -ne 0) { throw "Setup failed" }

      - name: App works
        shell: pwsh
        run: |
          $port = (Get-Content C:\Billcora\port.txt).Trim()
          $v = (Get-Content C:\Billcora\version.txt).Trim()
          Write-Host "version: $v"
          if ($v -ne '0.2.4') { throw "wrong version" }
          $null = Invoke-WebRequest "http://127.0.0.1:$port/login" -Method Post -Body @{ username = "admin"; password = "admin123" } -SessionVariable s -UseBasicParsing
          foreach ($pg in "/", "/zones", "/packages", "/payments", "/settings", "/users") {
            $r = Invoke-WebRequest "http://127.0.0.1:$port$pg" -WebSession $s -UseBasicParsing
            Write-Host "$pg -> $($r.StatusCode)"
            if ($r.StatusCode -ne 200 -or $r.Content -match "<title>Sign in") { throw "$pg failed" }
            if ($pg -eq "/" -and $r.Content -notmatch 'id="bc-upd"') { throw "update button missing" }
          }
          Write-Host "FRESH OK"