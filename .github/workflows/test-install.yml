name: Test install on fresh machines
on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  linux:
    name: Fresh Ubuntu - install, use, update
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fresh install with the one-line command
        run: curl -fsSL https://github.com/SINOBI-Melloflex/billkora/releases/latest/download/install.sh | sudo bash

      - name: Service is running and login page is up
        run: |
          sudo systemctl is-active billcora
          curl -fsS -o /dev/null http://127.0.0.1:4010/login

      - name: Log in as admin and open pages
        run: |
          J=$(mktemp)
          curl -fsS -c "$J" -b "$J" -o /dev/null -d "username=admin&password=admin123" http://127.0.0.1:4010/login
          for p in / /zones /packages /payments /settings /users /pools /pop /receipts; do
            code=$(curl -s -b "$J" -o /dev/null -w '%{http_code}' "http://127.0.0.1:4010$p")
            echo "$p -> $code"
            [ "$code" = "200" ] || exit 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:4010/favicon.ico

      - name: Shut down button really stops it
        run: |
          J=$(mktemp)
          curl -fsS -c "$J" -b "$J" -o /dev/null -d "username=admin&password=admin123" http://127.0.0.1:4010/login
          curl -fsS -b "$J" -d "mode=shutdown" http://127.0.0.1:4010/app/exit
          sleep 12
          if systemctl is-active --quiet billcora; then echo "still running after shutdown (BAD)"; exit 1; fi
          echo "stopped as expected"

      - name: Put marker data in database and config
        run: |
          sudo apt-get install -y sqlite3 >/dev/null
          sudo -u billcora sqlite3 /opt/billcora/billing.db "create table zz_marker(x); insert into zz_marker values(42);"
          echo "// kept-marker" | sudo tee -a /opt/billcora/config.js >/dev/null

      - name: Run the same command again (update)
        run: curl -fsSL https://github.com/SINOBI-Melloflex/billkora/releases/latest/download/install.sh | sudo bash

      - name: Data and settings survived the update
        run: |
          test "$(sudo -u billcora sqlite3 /opt/billcora/billing.db 'select x from zz_marker')" = "42"
          grep -q kept-marker /opt/billcora/config.js
          ls -d /opt/billcora/backups/update-before-*
          curl -fsS -o /dev/null http://127.0.0.1:4010/login
          sudo systemctl is-active billcora

  windows:
    name: Clean Windows - app package starts and works
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download the app package from the release and start it
        shell: pwsh
        run: |
          $b = "https://github.com/SINOBI-Melloflex/billkora/releases/latest/download"
          Invoke-WebRequest "$b/version.txt" -OutFile version.txt
          $v = (Get-Content version.txt -Raw).Trim()
          Invoke-WebRequest "$b/billcora-app-$v.zip" -OutFile app.zip
          Expand-Archive app.zip -DestinationPath app
          Write-Host "Files: $((Get-ChildItem app -Recurse -File).Count)"
          Set-Content -Path app\.secret -Value "citest" -NoNewline
          New-Item -ItemType Directory app\logs -Force | Out-Null
          $env:PORT = "4099"
          $p = Start-Process app\runtime\node.exe -ArgumentList "server.js" -WorkingDirectory app -PassThru -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Seconds 1
            try { if ((Invoke-WebRequest "http://127.0.0.1:4099/login" -UseBasicParsing -TimeoutSec 3).StatusCode -eq 200) { $ok = $true; break } } catch {}
          }
          if (-not $ok) { Get-Content err.txt -ErrorAction SilentlyContinue; Get-Content out.txt -ErrorAction SilentlyContinue; throw "login page did not come up" }
          Write-Host "login page is up"
          $null = Invoke-WebRequest "http://127.0.0.1:4099/login" -Method Post -Body @{ username = "admin"; password = "admin123" } -SessionVariable s -UseBasicParsing
          foreach ($pg in "/", "/zones", "/packages", "/payments", "/settings", "/users", "/pools", "/pop", "/receipts") {
            $r = Invoke-WebRequest "http://127.0.0.1:4099$pg" -WebSession $s -UseBasicParsing
            Write-Host "$pg -> $($r.StatusCode)"
            if ($r.StatusCode -ne 200 -or $r.Content -match "<title>Sign in") { throw "$pg failed" }
          }
          Stop-Process -Id $p.Id -Force